<form class="w-full max-w-md p-6 bg-white rounded-md shadow-md" (submit)="onSubmit($event)">
	<div class="mb-4">
		<label class="text-sm text-[#0f1616] font-medium mb-1 block">Correo electrónico</label>
		<input type="email" [(ngModel)]="email" name="email" required class="w-full h-10 rounded-md border border-[#e5e8ea] px-3 outline-none focus:ring-2 focus:ring-[#0093b2]" />
	</div>

	<div class="mb-4">
		<label class="text-sm text-[#0f1616] font-medium mb-1 block">Contraseña</label>
		<input type="password" [(ngModel)]="password" name="password" required class="w-full h-10 rounded-md border border-[#e5e8ea] px-3 outline-none focus:ring-2 focus:ring-[#0093b2]" />
	</div>

	<div class="flex items-center justify-between gap-4">
		<button type="submit" class="inline-flex h-10 items-center justify-center px-4 rounded-lg bg-[#0093b2] text-white font-bold">Iniciar sesión</button>
		<button type="button" class="inline-flex h-10 items-center justify-center px-4 rounded-lg bg-[#eff4f4] text-[#0f1616] font-bold">Registrarse</button>
	</div>
</form>
