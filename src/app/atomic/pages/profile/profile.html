<div class="profile-container">
  <header class="header">
    <div class="logo-section">
      <img src="https://res.cloudinary.com/djn8thk2s/image/upload/v1763361948/Logo-SurfingSpace-coworking_1_n4jb0d_c_crop_w_300_h_300_n26546.png" 
           alt="SurfSpace Logo" 
           class="logo">
      <span class="brand-name">SurfSpace</span>
    </div>
    <div class="header-actions">
      <span class="nav-link">Inicio</span>
      <button class="icon-button">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15 6.66667C15 5.34058 14.4732 4.06881 13.5355 3.13113C12.5979 2.19345 11.3261 1.66667 10 1.66667C8.67392 1.66667 7.40215 2.19345 6.46447 3.13113C5.52678 4.06881 5 5.34058 5 6.66667C5 12.5 2.5 14.1667 2.5 14.1667H17.5C17.5 14.1667 15 12.5 15 6.66667Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M11.4417 17.5C11.2952 17.7526 11.0849 17.9622 10.8319 18.1079C10.5789 18.2537 10.2922 18.3304 10 18.3304C9.70781 18.3304 9.42116 18.2537 9.16815 18.1079C8.91513 17.9622 8.70484 17.7526 8.55835 17.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="avatar">
        <img src="https://res.cloudinary.com/djn8thk2s/image/upload/v1748134747/e46ee9dd-8a52-4f83-92a1-566dbd6ce14c_fpyk9t.jpg" alt="User Avatar">
      </div>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Mi perfil</h1>

    <div class="form-section">
      <div class="form-group">
        <label for="name" class="form-label">Nombre</label>
        <input 
          type="text" 
          id="name" 
          class="form-input" 
          [(ngModel)]="profile.name">
      </div>

      <div class="form-group">
        <label for="cedula" class="form-label">
          Cédula <span class="label-note">(no se puede modificar)</span>
        </label>
        <input 
          type="text" 
          id="cedula" 
          class="form-input" 
          [value]="profile.cedula"
          disabled>
      </div>

      <div class="form-group">
        <label for="email" class="form-label">
          Correo electrónico <span class="label-note">(no se puede modificar)</span>
        </label>
        <input 
          type="email" 
          id="email" 
          class="form-input" 
          [value]="profile.email"
          disabled>
      </div>

      <div class="form-group">
        <label for="phone" class="form-label">Celular</label>
        <input 
          type="tel" 
          id="phone" 
          class="form-input" 
          [(ngModel)]="profile.phone">
      </div>
    </div>

    <div class="affiliation-section">
      <h2 class="section-title">Datos de afiliación</h2>
      
      <div class="affiliation-data">
        <div class="data-column">
          <div class="data-label">Tipo de afiliación</div>
          <div class="data-value">{{ isAffiliated ? profile.membershipType : 'N/A' }}</div>
        </div>
        <div class="data-column">
          <div class="data-label">Fecha de inicio</div>
          <div class="data-value">{{ isAffiliated ? profile.startDate : 'N/A' }}</div>
        </div>
        <div class="action-column" *ngIf="!isAffiliated">
          <button class="btn-affiliate" (click)="affiliate()">AFILIARME</button>
        </div>
      </div>
    </div>

    <div class="button-container">
      <button class="btn-save" (click)="editar()">Guardar cambios</button>
    </div>
  </main>
</div>
