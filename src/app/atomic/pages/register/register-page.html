<div class="navbar">
  
  <div class="navbar__left">
    <img
      class="navbar__logo"
      src="https://res.cloudinary.com/djn8thk2s/image/upload/v1763361948/Logo-SurfingSpace-coworking_1_n4jb0d_c_crop_w_300_h_300_n26546.png"
      alt="SurfSpace Logo"
    />
    <span class="navbar__title">SurfSpace</span>
  </div>

  <div class="navbar__right">
    <a class="navbar__link" routerLink="/welcome">Inicio</a>

    <button class="navbar__btn secondary" routerLink="/login">
      Iniciar sesión
    </button>
  </div>
</div>

<!-- Login Form -------------------------------------------------------------------------->

<div class="container">
  <h1 class="title">Bienvenido</h1>

  <form (ngSubmit)="createUser()" [formGroup]="form" class="form">
    <input
      class="input"
      type="text"
      formControlName="name"
      placeholder="Nombre"
    />

    <input
      class="input"
      type="number"
      formControlName="phone"
      placeholder="Teléfono"
    />

    <input
      class="input"
      type="email"
      formControlName="email"
      placeholder="Correo electrónico"
    />

    <input
      class="input"
      type="password"
      formControlName="password"
      placeholder="Contraseña"
    />

    <button type="submit" class="submit-btn" routerLink="/catalog">
      Registrarse
    </button>
  </form>

  <p class="login">
    ¿Ya tienes una cuenta?
    <a routerLink="/login">Inicia sesión</a>
  </p>
</div>
