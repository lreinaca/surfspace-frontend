<div class="navbar">
  
  <div class="navbar__left">

      alt="SurfSpace Logo"

  <div class="navbar__right">

    </button>

<!-- Login Form -------------------------------------------------------------------------->

<div class="container">
  <h1 class="title">Bienvenido</h1>

  <form (ngSubmit)="createUser()" [formGroup]="form" class="form">
    <input
      class="input"
      type="text"
      formControlName="name"
      placeholder="Nombre completo"
      [class.error]="form.get('name')?.invalid && form.get('name')?.touched"
    />
    <small *ngIf="form.get('name')?.invalid && form.get('name')?.touched" class="error-text">
      El nombre debe tener al menos 3 caracteres
    </small>

    <input
      class="input"
      type="tel"
      formControlName="phone"
      placeholder="Teléfono (10 dígitos)"
      [class.error]="form.get('phone')?.invalid && form.get('phone')?.touched"
    />
    <small *ngIf="form.get('phone')?.invalid && form.get('phone')?.touched" class="error-text">
      El teléfono debe tener 10 dígitos
    </small>

    <input
      class="input"
      type="email"
      formControlName="email"
      placeholder="Correo electrónico"
      [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
    />
    <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-text">
      Ingresa un correo válido
    </small>

    <input
      class="input"
      type="password"
      formControlName="password"
      placeholder="Contraseña (mínimo 6 caracteres)"
      [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
    />
    <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-text">
      La contraseña debe tener al menos 6 caracteres
    </small>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading || form.invalid">
      <span *ngIf="!loading">Registrarse</span>
      <span *ngIf="loading">Registrando...</span>
    </button>
  </form>

  <p class="login">
    ¿Ya tienes una cuenta?
    <a routerLink="/login">Inicia sesión</a>
  </p>
</div>
