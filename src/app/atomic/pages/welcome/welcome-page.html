<div class="welcome-page">
  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <img src="https://res.cloudinary.com/djn8thk2s/image/upload/v1763361948/Logo-SurfingSpace-coworking_1_n4jb0d_c_crop_w_300_h_300_n26546.png" 
           alt="SurfSpace Logo" 
           class="logo">
      <span class="brand-name">SurfSpace</span>
    </div>
    
    <div class="header-right">
      <button class="btn-login" routerLink="/login">Iniciar sesión</button>
      <button class="btn-register" routerLink="/register">Registrarse</button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">Bienvenido a SurfSpace</h1>
      <p class="hero-subtitle">Reserva tu espacio de trabajo ideal</p>
      <button class="btn-start" routerLink="/register">Comenzar ahora</button>
    </div>
  </section>

  <!-- CONTENT -->
  <div class="content-wrapper">
    <!-- SALAS DE REUNIONES -->
    <section class="section">
      <h2 class="section-title">Salas de reuniones</h2>
      
      <div class="space-list">
        <div *ngFor="let room of meetingRooms" class="space-card">
          <div class="space-info">
            <h3 class="space-title">{{ room.title }}</h3>
            <p class="space-description">{{ room.description }}</p>
            <button class="btn-reserve" routerLink="/login">Reservar</button>
          </div>
          <div class="space-image-container">
            <img [src]="room.image" [alt]="room.title" class="space-image">
          </div>
        </div>
      </div>
    </section>

    <!-- ESPACIOS DE TRABAJO COMPARTIDO -->
    <section class="section">
      <h2 class="section-title">Espacios de trabajo compartido</h2>
      
      <div class="space-list">
        <div *ngFor="let workspace of sharedWorkspaces" class="space-card">
          <div class="space-info">
            <h3 class="space-title">{{ workspace.title }}</h3>
            <p class="space-description">{{ workspace.description }}</p>
            <button class="btn-reserve" routerLink="/login">Reservar</button>
          </div>
          <div class="space-image-container">
            <img [src]="workspace.image" [alt]="workspace.title" class="space-image">
          </div>
        </div>
      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p class="footer-text">Para reservar, por favor regístrate o inicia sesión.</p>
    </footer>
  </div>
</div>
