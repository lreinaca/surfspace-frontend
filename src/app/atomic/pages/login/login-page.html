<div class="navbar">
  
  <!-- Logo and Title Section -->
  <div class="navbar__left">
    <img
      class="navbar__logo"
      src="https://res.cloudinary.com/djn8thk2s/image/upload/v1763361948/Logo-SurfingSpace-coworking_1_n4jb0d_c_crop_w_300_h_300_n26546.png"
      alt="SurfSpace Logo"
    />
    <span class="navbar__title">SurfSpace</span>
  </div>

  <div class="navbar__right">
    <a class="navbar__link" routerLink="/welcome">Inicio</a>

    <button class="navbar__btn primary">Reservar un Espacio</button>
    <button class="navbar__btn secondary" routerLink="/register">
      Registrarse
    </button>
  </div>
</div>

<div class="container">
  <h1 class="title">Bienvenido de Nuevo</h1>

  <form (ngSubmit)="login()" [formGroup]="form" class="form">
    <input
      class="input"
      type="email"
      formControlName="email"
      placeholder="Correo electrónico"
      [class.error]="form.get('email')?.invalid && form.get('email')?.touched"
    />
    <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-text">
      Ingresa un correo válido
    </small>

    <input
      class="input"
      type="password"
      formControlName="password"
      placeholder="Contraseña"
      [class.error]="form.get('password')?.invalid && form.get('password')?.touched"
    />
    <small *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-text">
      La contraseña debe tener al menos 6 caracteres
    </small>

    <div *ngIf="errorMessage" class="error-message">
      {{ errorMessage }}
    </div>

    <button type="submit" class="submit-btn" [disabled]="loading || form.invalid">
      <span *ngIf="!loading">Iniciar Sesión</span>
      <span *ngIf="loading">Iniciando sesión...</span>
    </button>
  </form>

  <p class="register">
    ¿No tienes una cuenta?
    <a routerLink="/register">Regístrate</a>
  </p>
</div>
