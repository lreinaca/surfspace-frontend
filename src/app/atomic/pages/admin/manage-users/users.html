<div class="page">

  <div class="navbar__left">
    <img class="navbar__logo"
      src="https://res.cloudinary.com/djn8thk2s/image/upload/v1763361948/Logo-SurfingSpace-coworking_1_n4jb0d_c_crop_w_300_h_300_n26546.png"
      alt="SurfSpace Logo" />
    <span class="navbar__title">SurfSpace</span>
  </div>

  <h1 class="title">Usuarios</h1>

  <!-- Search Box -->
  <div class="search-box">
    <lucide-icon name="search" class="search-icon"></lucide-icon>
    <input type="text" placeholder="Buscar usuarios por nombre o email" [(ngModel)]="search" (input)="filterUsers()" />
  </div>

  <!-- Filters -->
  <div class="filters">
    <button class="filter-btn" (click)="toggleFilter('rol')">
      Rol
      <lucide-icon name="chevron-down"></lucide-icon>
    </button>

    <button class="filter-btn" (click)="toggleFilter('estado')">
      Estado
      <lucide-icon name="chevron-down"></lucide-icon>
    </button>
  </div>

  <!-- Table -->
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estado</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of filteredUsers">

          <td>{{ user.nombre }}</td>

          <td class="email">{{ user.email }}</td>

          <td>
            <span class="badge rol">{{ user.rol }}</span>
          </td>

          <td>
            <span class="badge estado" [ngClass]="{
                activo: user.estado === 'Activo',
                inactivo: user.estado === 'Inactivo'
              }">
              {{ user.estado }}
            </span>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>
